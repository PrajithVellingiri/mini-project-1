# =============================================================================
#  Production Profile: application-prod.properties
# =============================================================================

# Enforce secure SSL connection for cloud MySQL databases (TiDB Cloud / Aiven)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_transport_db}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tuned Hikari connection pool for 512MB RAM free-tier cloud containers
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=15000

# JPA Validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Allowed Frontend Origin (set by deployment platform)
app.cors.allowed-origins=${FRONTEND_ORIGIN:*}
