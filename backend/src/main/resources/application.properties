spring.application.name=backend

# =============================================================================
#  Smart Public Transportation Route Optimization — Application Configuration
# =============================================================================

# ── Dynamic Server Port (Cloud Container Compatibility: Render, Koyeb, Railway)
server.port=${PORT:8080}

# ── MySQL Connection Settings (Environment variables with safe defaults) ─────
# Accepts either a full DATABASE_URL (common in cloud providers) or decomposed components.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_transport_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate: VALIDATE against existing MySQL schema (never auto-create or drop)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Cross-Origin Resource Sharing (CORS) ────────────────────────────────────
# Comma-separated list of allowed frontend origins (e.g. Vercel deployment URL)
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,*}
