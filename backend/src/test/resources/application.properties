# =============================================================================
#  Test Configuration for Isolated Unit & Integration Tests (No MySQL Required)
# =============================================================================
spring.application.name=backend-test

# Use in-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 automatically generates schema matching the entities during tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Security & Authentication Configuration for Tests
app.security.jwt.secret=SmartTransportSecureJwtSecretKeyForCollegeProjectEvaluation2026Secure256BitKey!
app.security.jwt.expiration-ms=86400000
app.security.seed-demo-users=true
app.cors.allowed-origins=http://localhost:5173
